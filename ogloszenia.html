<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ogłoszenia – Nieruchomości</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="wyniki">
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 15.5 16 9l8 6.5V24a1 1 0 0 1-1 1h-4.5v-5.5h-5V25H9a1 1 0 0 1-1-1z" fill="#fff"/></svg>
      <span>Nieruchomości</span>
    </a>
    <nav class="main-nav" aria-label="Główna nawigacja">
      <a href="ogloszenia.html?transakcja=sprzedaz" data-nav="sprzedaz">Sprzedaż</a>
      <a href="ogloszenia.html?transakcja=wynajem" data-nav="wynajem">Wynajem</a>
      <a href="ogloszenia.html" class="hide-sm" data-nav="">Wszystkie</a>
    </nav>
  </div>
</header>

<main>
  <section class="filters-bar">
    <form class="container filters" action="ogloszenia.html" method="get" id="filters">
      <label class="field">
        <span>Transakcja</span>
        <select name="transakcja">
          <option value="">Wszystkie</option>
          <option value="sprzedaz">Sprzedaż</option>
          <option value="wynajem">Wynajem</option>
        </select>
      </label>
      <label class="field">
        <span>Rodzaj</span>
        <select name="typ">
          <option value="">Wszystkie</option>
          <option value="mieszkanie">Mieszkanie</option>
          <option value="dom">Dom</option>
          <option value="dzialka">Działka</option>
          <option value="lokal">Lokal użytkowy</option>
          <option value="garaz">Garaż</option>
        </select>
      </label>
      <label class="field field-grow">
        <span>Lokalizacja</span>
        <input type="text" name="lokalizacja" placeholder="Miasto, dzielnica, ulica">
      </label>
      <div class="field field-range">
        <span>Cena (zł)</span>
        <div class="range">
          <input type="text" name="cenaOd" inputmode="numeric" placeholder="od" aria-label="Cena od">
          <input type="text" name="cenaDo" inputmode="numeric" placeholder="do" aria-label="Cena do">
        </div>
      </div>
      <div class="field field-range">
        <span>Powierzchnia (m²)</span>
        <div class="range">
          <input type="text" name="metrazOd" inputmode="decimal" placeholder="od" aria-label="Powierzchnia od">
          <input type="text" name="metrazDo" inputmode="decimal" placeholder="do" aria-label="Powierzchnia do">
        </div>
      </div>
      <label class="field">
        <span>Pokoje</span>
        <select name="pokoje">
          <option value="">Dowolnie</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4 i więcej</option>
        </select>
      </label>
      <label class="field">
        <span>Rynek</span>
        <select name="rynek">
          <option value="">Dowolny</option>
          <option value="pierwotny">Pierwotny</option>
          <option value="wtorny">Wtórny</option>
        </select>
      </label>
      <div class="filters-actions">
        <button class="btn btn-primary" type="submit">Szukaj</button>
        <a class="link-muted" href="ogloszenia.html">Wyczyść</a>
      </div>
    </form>
  </section>

  <section class="container section">
    <div class="results-head">
      <div>
        <h1 class="results-title" id="heading">Nieruchomości</h1>
        <p class="muted" id="total"></p>
      </div>
      <label class="sort">
        <span>Sortuj:</span>
        <select name="sort" form="filters" data-autosubmit>
          <option value="najnowsze">Najnowsze</option>
          <option value="cena-rosnaco">Cena: od najniższej</option>
          <option value="cena-malejaco">Cena: od najwyższej</option>
          <option value="metraz-rosnaco">Powierzchnia: od najmniejszej</option>
          <option value="metraz-malejaco">Powierzchnia: od największej</option>
        </select>
      </label>
    </div>
    <div id="results"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <strong>Nieruchomości</strong>
      <p>Ogłoszenia nieruchomości na sprzedaż i wynajem.</p>
    </div>
    <div class="footer-links">
      <a href="ogloszenia.html?transakcja=sprzedaz&typ=mieszkanie">Mieszkania na sprzedaż</a>
      <a href="ogloszenia.html?transakcja=wynajem&typ=mieszkanie">Mieszkania na wynajem</a>
      <a href="ogloszenia.html?transakcja=sprzedaz&typ=dom">Domy na sprzedaż</a>
      <a href="ogloszenia.html?transakcja=sprzedaz&typ=dzialka">Działki</a>
    </div>
    <p class="copy">© <span data-year></span> Nieruchomości</p>
  </div>
</footer>

<script src="dane/ogloszenia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
